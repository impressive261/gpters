name: Build and validate Katharine app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'katharine-src/**'
      - 'katharine/app.js'
      - 'katharine/styles.css'
      - 'katharine/index.html'
      - 'katharine/scheduler.js'
      - '.github/workflows/katharine-app.yml'
concurrency:
  group: katharine-material-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and browser validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum ffmpeg
          python -m pip install --disable-pip-version-check reportlab pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Build complete bilingual data and printable materials
        run: |
          python katharine-src/enrich.py
          python katharine-src/questions.py
          python katharine-src/patterns.py
          python katharine-src/build.py
          python katharine-src/assets.py
          node --check katharine/app.js
          node --check katharine/scheduler.js
          node --check katharine/sw.js
      - name: Validate audio, PDFs, scheduling and browser behavior
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory katharine > /tmp/katharine-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python katharine-src/test.py
      - name: Record real Pages status without changing administration settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p katharine-qa
          gh api repos/${{ github.repository }} --jq '{full_name,has_pages,html_url,default_branch}' > katharine-qa/deployment_status.json
      - name: Publish only Katharine-generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add katharine
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Katharine app, audio and speaking PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload complete downloadable app and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katharine-complete-app-and-validation
          path: |
            katharine/
            katharine-src/
            katharine-qa/
          include-hidden-files: true
          retention-days: 30
